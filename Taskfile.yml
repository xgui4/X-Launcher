# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  GREETING: Hello, world!

tasks:
  default:
    desc: Print a greeting message
    cmds:
      - echo "{{.GREETING}}"
    silent: true

  build:
    desc: Build the .net9.0 Solution and move the files to the target folder
    cmds:
      - dotnet build src/backend/X_Launcher.Core/X_Launcher.Core.csproj -c Release -o target/backend/X_Launcher.Core -f net9.0
      - dotnet build src/backend/X_Launcher.Service/X_Launcher.Service.csproj -c Release -o target/backend/X_Launcher.Service -f net9.0
      - cp src/x-launcher-core.py target/x-launcher-core.py
      - mkdir -p target/frontend
      - cp -r src/frontend/*  target/frontend/

  build-legacy:
    desc: Build the legacy versions
    cmds:
      - dotnet build src/legacy/X_Launcher.App/X_Launcher.App.csproj -c Release -o target/legacy/X_Launcher.App -f net9.0
      - dotnet build src/legacy/X_Launcher.CLI/X_Launcher.CLI.csproj -c Release -o target/legacy/X_Launcher.CLI -f net9.0 
      # - dotnet build src/legacy/X_Launcher.CLI.Windows/X_Launcher.CLI.Windows.csproj -c Release -o target/legacy/X_Launcher.CLI.Windows -f net9.0  # -> disabled by default to not working outside of Windows
      - dotnet build src/legacy/X_Launcher.Core/X_Launcher.Core.csproj -c Release -o target/legacy/X_Launcher.Core -f net9.0
      - dotnet build src/legacy/X_Launcher.Desktop/X_Launcher.Desktop.csproj -c Release -o target/legacy/X_Launcher.Desktop -f net9.0
      - cp start-legacy.py target/start-legacy.py
  run:
    desc: Run the application
    depends_on: [build]
    cmds:
      - python3 target/x-launcher-core.py 
  run-legacy:
    desc: Run the legacy application
    depends_on: [build-legacy]
    cmds:
      - python3 target/start-legacy.py 

  clean:
    desc: Clean the target folder
    cmds:
      - rm -rf target/*